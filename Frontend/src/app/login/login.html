<div class="login">
  <p-card class="login-card">
    <ng-template pTemplate="title">
      Welcome!
    </ng-template>
    <ng-template pTemplate="subtitle">
      Log into your account.
    </ng-template>
    <ng-template pTemplate="footer">
      <button pButton type="button" routerLink="/register">Register</button>
    </ng-template>
    <form (ngSubmit)="onLogin()" class="form">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          pInputText
          [(ngModel)]="email"
          name="email"
          required
          placeholder="introdu email"
        />
      </div>
      <div class="field">
        <p-floatlabel variant="on">
          <p-password
            inputId="password"
            [(ngModel)]="password"
            [toggleMask]="true"
            [feedback]="false"
          ></p-password>
          <label for="password">Password:</label>
        </p-floatlabel>
      </div>
      <button pButton type="submit" class="login-button">Login</button>
    </form>
  </p-card>
</div>
