<div class="container">
  <div class="card">

    <h2>Register</h2>
    <p class="subtitle">Creează-ți contul</p>

    <form (ngSubmit)="onRegister()">

      <label>Nume</label>
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="Numele tău"
        required
      />

      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="email@email.com"
        required
      />

      <label>Parolă</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="parola"
        required
      />

      <button type="submit">Create account</button>
    </form>

    <p class="footer">
      Ai deja cont? <a href="#">Login</a>
    </p>

  </div>
</div>
